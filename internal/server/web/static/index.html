<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoBAS - 入侵与攻击模拟平台</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡</text></svg>">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-icon">🛡</span>
        <div class="logo-text">
          <div class="logo-name">GoBAS</div>
          <div class="logo-sub">入侵与攻击模拟</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a href="#/dashboard" data-route="dashboard"><span class="nav-icon">📊</span>仪表盘</a>
        <a href="#/pocs" data-route="pocs"><span class="nav-icon">📦</span>POC 库</a>
        <a href="#/poc-sets" data-route="poc-sets"><span class="nav-icon">📁</span>POC 模板集</a>
        <a href="#/targets" data-route="targets"><span class="nav-icon">🎯</span>目标管理</a>
        <a href="#/scan/new" data-route="scan-new"><span class="nav-icon">⚡</span>发起攻击模拟</a>
        <a href="#/scans" data-route="scans"><span class="nav-icon">📜</span>扫描历史</a>
        <a href="#/sync" data-route="sync"><span class="nav-icon">🔄</span>POC 源同步</a>
      </nav>
      <div class="sidebar-footer">
        <div id="engine-status" class="engine-status"><span class="dot"></span>服务运行中</div>
      </div>
    </aside>
    <main class="main" id="main"></main>
    <!-- 右上角用户菜单（胶囊按钮下拉：修改密码 / 退出登录） -->
    <header class="topbar" id="topbar">
      <div class="user-menu hidden" id="user-menu">
        <button class="user-chip" id="avatar-btn" type="button">
          <svg class="uc-icon" viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M10.561 8.073a6.005 6.005 0 0 1 3.432 5.142.75.75 0 1 1-1.498.07 4.5 4.5 0 0 0-8.99 0 .75.75 0 1 1-1.498-.07 6.005 6.005 0 0 1 3.432-5.142 3.999 3.999 0 1 1 5.123 0ZM10.5 5a2.5 2.5 0 1 0-5 0 2.5 2.5 0 0 0 5 0Z"/></svg>
          <span class="uc-name" id="uc-name"></span>
          <svg class="uc-caret" viewBox="0 0 16 16" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M12.78 5.22a.749.749 0 0 1 0 1.06l-4.25 4.25a.749.749 0 0 1-1.06 0L3.22 6.28a.749.749 0 1 1 1.06-1.06L8 8.939l3.72-3.719a.749.749 0 0 1 1.06 0Z"/></svg>
        </button>
        <div class="user-dropdown hidden" id="user-dropdown">
          <button class="ud-item" id="ud-change-pwd">🔑 修改密码</button>
          <button class="ud-item ud-danger" id="ud-logout">🚪 退出登录</button>
        </div>
      </div>
    </header>
  </div>

  <!-- 全局消息提示 -->
  <div id="toast-container" class="toast-container"></div>

  <!-- POC 详情弹窗 -->
  <div id="modal-root"></div>

  <script src="/static/app.js"></script>
</body>
</html>
